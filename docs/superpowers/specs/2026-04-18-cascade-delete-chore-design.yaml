spec:
  title: Cascade Delete Chore
  date: 2026-04-18
  status: approved

overview: >
  When an admin deletes a chore from the pool, the deletion cascades to archive
  all active assignments for every player. Calendar entries are not physically
  deleted or separately removed — they are part of chore_assignments, so
  archiving assignments is what hides them from calendar views. The task pool
  is already clean (useChores excludes deleted chores). This spec covers
  assignments, calendar visibility, notifications, and security enforcement.

soft_delete_clarification: >
  This is a soft delete. No rows are physically removed. The chore row remains
  with status = 'deleted'. Affected chore_assignments remain with archived = true.
  All referential integrity (completions, coin transactions) is preserved.
  The operation is not recoverable from the UI, but data is not destroyed.

calendar_entries: >
  Calendar entries are columns on chore_assignments (calendar_day, calendar_slot).
  They are not a separate table. Archiving the assignment (archived = true) is
  sufficient to hide it from useCalendarAssignments, which already filters
  archived = false. No separate delete or nulling of calendar columns is needed.

out_of_scope:
  - Coin balance changes on deletion
  - Bulk delete
  - Realtime push to connected players (next page load is sufficient)

database:
  migration: supabase/migrations/018_cascade_delete_chore.sql

  rpc:
    name: delete_chore
    signature: delete_chore(p_chore_id uuid)
    security: INVOKER
    description: >
      The RPC is the sole enforcement point for all business rules. The UI
      pre-check is a UX hint only and provides no security guarantee. The RPC
      runs as the calling user so RLS stays active on all underlying tables.
      All steps execute inside a single transaction — if any step fails
      (including notification insertion), the entire transaction rolls back.
      No partial state is possible.

    authorization:
      check: >
        SELECT family_id FROM chores WHERE id = p_chore_id
        must equal
        SELECT family_id FROM profiles WHERE id = auth.uid()
      strict: >
        Both values must be non-null and equal. A null family_id on either side
        is treated as unauthorized. This prevents cross-family access and
        unauthenticated calls.
      on_fail: "Raises SQLSTATE 'P0001' message 'UNAUTHORIZED'"

    steps:
      1_family_scope_check: >
        Fetch chore.family_id. Fetch caller's family_id from profiles where
        id = auth.uid(). Both must be non-null and equal. Raises 'UNAUTHORIZED'
        if not. This is the strict, non-leaky family authorization gate.
      2_status_validation: >
        If the chore is already 'deleted': return immediately with no error and
        no further action (idempotent no-op). Do not raise an exception.
        If the chore is 'archived' or 'pending_approval': raise SQLSTATE 'P0001'
        with message 'INVALID_STATUS' — these states are not deletable.
        Only status = 'active' proceeds past this step.
      3_pending_completion_check: >
        Check for any chore_completions.status = 'pending' linked to this chore
        via chore_assignments. Raises 'PENDING_COMPLETIONS' if found.
        This is the server-side re-check — the UI hint does not replace this.
      4_archive_assignments: >
        SET archived = true on all chore_assignments for this chore where
        status != 'completed'. Returns the list of affected assignment IDs
        and their reminder_enabled flags for use in step 5.
      5_insert_notifications: >
        For each assignment from step 4 where reminder_enabled = true, insert
        one row into notifications (type = 'chore_deleted'). If this INSERT
        fails for any row, the transaction rolls back entirely — notifications
        and assignment archiving are all-or-nothing with the chore deletion.
      6_soft_delete_chore: >
        UPDATE chores SET status = 'deleted' WHERE id = p_chore_id.

    idempotency: >
      If the chore is already status = 'deleted' when the RPC is called, step 2
      returns immediately with no error and no further action. No exception is
      raised, no assignments are touched again. Calling delete_chore twice on
      the same chore is safe and produces no observable side effects.

  rls_coverage:
    chores: >
      Existing policy — admins can UPDATE chores within their own family.
      SECURITY INVOKER means this policy applies to the RPC caller, not a
      privileged role. Direct UPDATE attempts from non-admins are blocked.
    chore_assignments: >
      Existing policy — admins can UPDATE assignments within their family.
      The RPC archives assignments via UPDATE, covered by this policy.
    notifications: >
      Existing policy — users can INSERT notifications for members of their
      family. The RPC inserts on behalf of the admin, covered by this policy.
    bypass_paths: >
      There is no SECURITY DEFINER escalation. All table operations go through
      RLS as the calling user. A direct REST/PostgREST call to UPDATE chores
      bypassing the RPC will hit the BEFORE UPDATE trigger as a secondary guard.

  trigger:
    name: trg_chore_deleted_guard
    type: BEFORE UPDATE ON chores
    search_path: "public, pg_catalog"
    fires_when: "NEW.status = 'deleted' AND OLD.status != 'deleted'"
    description: >
      Secondary guard — not the primary enforcement point, but provides full
      protection for direct-bypass paths (e.g. direct PostgREST or service role
      misuse). Executes two actions in order:
      (1) Re-checks for pending completions and raises an exception if found —
      same check as the RPC, ensuring no bypass can skip it.
      (2) Archives all non-completed chore_assignments for this chore
      (SET archived = true WHERE chore_id = NEW.id AND status != 'completed').
      This means even a direct table UPDATE that bypasses the RPC still cascades
      correctly. The trigger and RPC are consistent — the RPC archives first then
      updates the chore, so the trigger sees archived rows already in place and
      the archive step is effectively a no-op when called via the RPC.
      SET search_path prevents schema injection. Fires only on actual status
      transition to 'deleted', never on unrelated chore updates.

views_audit:
  description: >
    All hooks and pages that read chore_assignments or depend on assignment data
    were audited to confirm none expose deleted-chore assignments after archiving.
  hooks:
    useChoreAssignments:
      filters_archived: true
      verdict: safe — archived = false filter excludes all archived assignments
    useCalendarAssignments:
      filters_archived: true
      verdict: safe — archived = false filter excludes all archived assignments
    usePendingCompletions:
      queries: chore_completions (not chore_assignments directly)
      verdict: >
        safe — the RPC blocks deletion if any pending completions exist, so
        by the time a chore is deleted there are no pending completions to show.
        This hook can never surface a completion for a deleted chore.
    useAdminDashboardStats:
      queries: coin_transactions and trade_offers only
      verdict: safe — does not touch chore_assignments at all
    useWeeklyPopulation:
      queries: calls populate_weekly_assignments RPC only
      verdict: safe — does not read chore_assignments directly
  conclusion: >
    No existing hook or page reads unarchived chore_assignments without the
    archived = false filter. No additional query changes are required.

types:
  file: src/types/database.ts
  changes:
    - Add 'chore_deleted' to NotificationType union

frontend:
  file: src/pages/admin/chores/ChoresPage.tsx
  note: >
    The UI pre-check is a UX hint only. It gives the admin fast feedback
    without a round trip to the RPC. The server enforces all rules regardless
    of whether the UI check runs or is bypassed.

  pre_delete_hint:
    trigger: admin clicks Delete button (before dialog opens)
    action: >
      Query chore_completions joined through chore_assignments for
      status = 'pending' on this chore.
    on_found:
      show_inline_warning: "לא ניתן למחוק - ישנה משימה הדורשת אישור או דחייה"
      dialog_does_not_open: true
    on_clear:
      open_confirmation_dialog: true

  delete_function:
    call: "supabase.rpc('delete_chore', { p_chore_id: chore.id })"
    on_success:
      - close dialog
      - refetch()
    on_error:
      error_map:
        PENDING_COMPLETIONS: "לא ניתן למחוק - ישנה משימה הדורשת אישור או דחייה"
        INVALID_STATUS: "לא ניתן למחוק משימה בסטטוס זה"
        UNAUTHORIZED: "אין הרשאה למחוק משימה זו"
        generic: "שגיאה במחיקת המשימה"

  no_hook_changes_required: >
    useChoreAssignments and useCalendarAssignments both filter archived = false.
    Once the RPC archives assignments, they disappear from player dashboards
    and calendars on next fetch automatically. No query changes needed.

propagation:
  mechanism: next page load / manual refetch
  realtime_push: false
  rationale: >
    Both hooks are one-time fetches with no Supabase realtime subscription.
    Players see the deleted task disappear on their next navigation or reload.

security_summary:
  enforcement_hierarchy:
    primary: RPC function (sole business logic enforcement point)
    secondary: BEFORE UPDATE trigger (direct bypass guard)
    ui: Pre-check hint (UX only, no security value)
  rpc_guarantees:
    - Family-scope authorization is strict and null-safe
    - Pending completion check is server-side and inside the transaction
    - Status validation blocks deletion of archived and pending_approval chores
    - Already-deleted chores are handled idempotently
    - Notification failure rolls back the entire transaction
    - SECURITY INVOKER keeps RLS active — no privilege escalation
  trigger_guarantees:
    - SET search_path prevents schema injection
    - Fires only on 'deleted' transition, not on every chore update
    - Cannot be bypassed by direct table writes

files_changed:
  - path: supabase/migrations/018_cascade_delete_chore.sql
    change: New — delete_chore RPC + trg_chore_deleted_guard trigger
  - path: src/types/database.ts
    change: Add 'chore_deleted' to NotificationType
  - path: src/pages/admin/chores/ChoresPage.tsx
    change: Replace deleteChore with UX hint + RPC call + full error mapping
  - path: src/pages/admin/chores/__tests__/ChoresPage.test.tsx
    change: Update delete tests — RPC call, all error codes, UX hint behaviour
